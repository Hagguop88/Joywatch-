<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130" fill="none">
  <defs>
    <!-- Main Red Stem -->
    <linearGradient id="nflix-red1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="70%" stop-color="#B81D24"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>
    <!-- Folded Front Ribbon -->
    <linearGradient id="nflix-red2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B81D24"/>
    </linearGradient>
    <filter id="nflix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#E50914" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#nflix-glow)">
    <!-- Back Stem & Bottom Hook of J -->
    <path d="M 52 10 L 76 10 L 76 80 C 76 100 62 116 38 116 C 18 116 6 102 6 84 L 28 84 C 28 93 34 98 42 98 C 50 98 54 90 54 78 L 54 28 Z" fill="url(#nflix-red1)" />
    
    <!-- 3D Fold Ribbon (Front ribbon forming the top horizontal bar & diagonal shadow) -->
    <path d="M 22 10 L 76 10 L 52 90 L 28 84 L 52 28 L 22 28 Z" fill="url(#nflix-red2)" />
    
    <!-- Shadow beneath the diagonal fold -->
    <path d="M 52 28 L 76 10 L 76 28 Z" fill="#000" opacity="0.4" />
    <path d="M 22 28 L 52 28 L 28 84 Z" fill="#000" opacity="0.25" />
  </g>
</svg>
